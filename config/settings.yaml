# RR Pressure Index - every tunable number lives here. Seed 42 everywhere.
version: "2.0.0"
seed: 42

app:
  public_mode: true           # true in the public build: no private pages, no saved-setting writes, method-first

paths:                         # relative to the repo root
  raw: data/raw
  processed: data/processed
  outputs_private: outputs/private
  outputs_public: outputs/public
  decision_log: outputs/private/decision_log.csv
  overrides: config/analyst_overrides.yaml
  rr_history: config/rr_history.yaml

# --- S1 data layer --------------------------------------------------------------------------
data:
  super_over_innings: [3, 4]   # excluded from baselines, reported separately
  legal_extras: [legbyes, byes]                # plus "no extra" (NaN)
  not_faced_extras: [wide]                     # balls faced = every delivery except these
  # "other" (264 rows): treated as a no-ball variant (NOT legal). Evidence: with it illegal, 100% of
  # the 216 completed overs containing it have exactly 6 legal balls; with it legal, 0% do.
  other_extra_legal: false
  extra_run_events: {wide: 1, Overstep: 1, legbyes: 1, byes: 1, other: 1, Penalty: 5}
  bowler_charged_extras: [wide, Overstep, other]   # extras that count against the bowler
  bowler_wicket_exclude: [RunOut, Retire Out, Obstracting the field, Obstructing the field]
  batter_dismissal_exclude: [Retire Out]
  chase_early_tolerance_runs: 10   # an early-ending chase counts as reached if within this of the target
  validation_target_pct: 95    # S1 "done when": reconstructed winner = actual winner in >= 95% decided matches

tiers:
  full_members: [Afghanistan, Australia, Bangladesh, England, India, Ireland, New Zealand, Pakistan,
                 South Africa, Sri Lanka, West Indies, Zimbabwe]
  emerging_comp_keywords: [Emerging, Rising Stars]   # T20 comps that are not IPL
  a_team_suffix: " A"

phases:                        # over numbers, 1-based inclusive
  powerplay: [1, 6]
  middle: [7, 15]
  death: [16, 20]

# --- S2 win probability + pressure ------------------------------------------------------------
wp_model:
  exclude_reduced_overs: true  # rain-reduced matches (an innings allotted < 120 balls) stay out of training;
                               # the 20-over model misreads a 5-over innings. Their balls are flagged, not rated.
  tie_handling: half           # half (tie = 0.5, weighted as two half rows) | drop
  cv_folds: 5
  time_split: {train_until: 2024, test_from: 2025}
  calibration: isotonic        # isotonic | sigmoid
  spline_knots: 6
  hgb: {max_iter: 300, learning_rate: 0.06, max_leaf_nodes: 31, min_samples_leaf: 80}
  calibration_bins: 10

pressure:
  outcomes: [dot, "1", "2", "4", "6", wicket]
  normalise_by: innings        # innings | all. "innings": 1.0 = an average ball OF THAT INNINGS. With "all", 94% of
                               # high-pressure balls fall in chases because first-innings WP is less certain
                               # (Brier 0.215 vs 0.128), which shrinks its swings - a model artefact, not calm.
  high_pct: 20                 # high-pressure ball = top X% of leverage
  bands_pct: [50, 80]          # low < 50th pct <= medium < 80th <= high
  knockout_multiplier: 1.15    # shown separately; applied to the pressure index
  rules:
    chase_rrr_minus_crr: 2.0
    chase_balls_remaining_max: 60
    collapse_wickets_min: 5
    collapse_balls_remaining_min: 24
    close_chase_death_margin_runs: 12   # death overs, |runs_needed - par| <= this
    knockout_death: true
  example_matches: 4

# --- S3 expected outcomes, metrics, ratings ----------------------------------------------------
expected:
  context:                     # extra context for the expected-outcome baselines (each can be switched off)
    era: true                  # season x competition (IPL scoring rose from SR 134 in 2022 to 156 in 2026)
    bowl_kind: true            # left-arm pace / right-arm pace / wrist spin / finger spin x batting hand
    opposition_strength: true  # opponent team-season attack (for batters) or batting (for bowlers) strength
  opposition_shrink_balls: 600 # team-season rate shrunk toward its competition-season mean
  method: binned               # binned averages with smoothing (hgb available as an option)
  smoothing_k: 200             # pseudo-balls toward the parent bin
  rrr_buckets: [0, 6, 8, 10, 12, 99]

rating:
  value_blend: {wpa: 0.5, rae: 0.5}    # component A
  weights: {A: 0.5, B: 0.25, C: 0.25}
  shrink_k_balls: 100
  consistency_min_pressure_balls: 3
  consistency_shrink_matches: 5   # share of positive matches is shrunk toward the role mean with 5 pseudo-matches
  consistency_blend: {share_positive: 0.5, low_spread: 0.5}
  eligibility:
    batter_min_pressure_balls: 120
    batter_min_pressure_innings: 12
    bowler_min_pressure_balls: 120
    bowler_min_pressure_matches: 12
  associate_weight: 0.5
  associate_exclude: false
  emerging_weight: 0.7
  recency_on: true
  season_weights: {2026: 1.0, 2025: 0.9, 2024: 0.8, 2023: 0.7, 2022: 0.6}
  top_n: 10
  next_n: 10

# --- S4 reliability -----------------------------------------------------------------------------
reliability:
  bootstrap_draws: 1000
  interval: 0.80
  split_half: {first: [2022, 2023], second: [2024, 2025, 2026]}
  thresholds_pct: [10, 20, 30]
  weight_sets:
    default: {A: 0.5, B: 0.25, C: 0.25}
    quality_heavy: {A: 0.7, B: 0.1, C: 0.2}
    delta_heavy: {A: 0.3, B: 0.5, C: 0.2}
    consistency_heavy: {A: 0.3, B: 0.2, C: 0.5}
  labels: [[80, Robust], [50, Likely], [0, Sensitive]]
  blend_grid_wpa: [0.5, 0.25, 0.0]   # persistence diagnostic for the WPA / RAE blend of component A
  subset_eligibility_factor: 0.5   # split-half / IPL-only / T20I-only use half the eligibility minimums
  dependence_rank_gap: 15      # flag a player whose IPL-only and T20I-only ranks differ by more than this

rr_target:                     # the brief: reliable players under pressure whom RR should back at the IPL 2027 auction
  use_for_final: true          # the submission model list = RR auction targets (the pure pressure ranking is kept too)
  funnel:
    min_pressure_balls: 180    # reliability gate (evidence: doubles batter repeatability vs 120)
    min_pressure_units: 15     # innings (batters) / matches (bowlers) with pressure balls
    active_from: 2025          # played in 2025 or later
    recent_from: 2025
    recent_pressure_balls: 40  # current-form sample since recent_from
    require_level: true        # IPL or full-member T20I experience (not associate / A-team only)
    exclude_current_rr: true   # RR's latest IPL squad = retain candidates, not auction targets
  need_seasons_from: 2025      # RR's needs are measured on these seasons (rank among the 10 IPL teams, under pressure)
  fit_shrink_balls: 60         # phase performance shrunk toward 0 with 60 pseudo-balls
  alignment:                   # hard gate: a target must help where RR actually needs it
    min_need_weight: 0.40      # a "need" phase = RR in the bottom ~60% of IPL teams there (need weight >= 0.4)
    min_phase_balls: 40        # pressure balls in that phase
  fit_weight: 0.30             # target score = 0.70 x pressure rating + 0.30 x RR fit (both 0-100 within the pool)
  availability_file: config/auction_pool.yaml

analyst:
  min_reason_chars: 10

figures:
  size_px: [1920, 1080]
  dpi: 100
  watermark: "Confidential - SupeRR Selector use only"
  placeholder: "[Your reasoning here]"
